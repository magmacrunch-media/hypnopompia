# iOS Simulator test builds, served off magmacrunch-server.
#
# Installed on the Pi as /etc/nginx/private.d/ios.conf, which the 443 server in
# the website repo's arcade/scripts/nginx-magmacrunch.conf includes with
# `include /etc/nginx/private.d/*.conf;`. __PATH__ is replaced at install by an
# unguessable segment, exactly as block-island.conf beside it is:
#
#     sed "s/__PATH__/ios-$(openssl rand -hex 5)/g" nginx-private.conf \
#         | sudo tee /etc/nginx/private.d/ios.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# Run `nginx -t` BEFORE reloading and not after. That Pi also serves
# magmacrunch.com, and a reload with a bad conf in private.d takes the site down
# rather than just this page.
#
# The URL is the secret. Two of the four projects served here are private
# repositories, so this page is the only way to hand somebody their build at all
# -- a GitHub release asset on a private repo needs an account with access. That
# is also why the real path exists only on the Pi and in no repository:
# tools/deploy-sim.mjs reads it back over ssh to print the link.
#
# Layout under /srv/private/ios/, all written by tools/deploy-sim.mjs:
#     index.html          the landing page
#     <project>/          <project>-sim-<date>-<game>-<shell>.zip, the newest few
#     <project>/build.json    the manifest of the newest one

location = /__PATH__ {
    return 301 /__PATH__/;
}

location /__PATH__/ {
    alias /srv/private/ios/;
    index index.html;

    # A types block inside a location replaces the whole map rather than adding
    # to it, so everything served here is listed. Short, because this page
    # serves one HTML file and some zips and nothing else.
    types {
        text/html        html;
        text/plain       txt;
        application/zip  zip;
        application/json json;
    }
    default_type application/octet-stream;

    # No gzip_static here, unlike block-island.conf: a zip is already
    # compressed, and the page it sits beside is a few KB. There is nothing to
    # gain and a second copy of every build to store on a 15 GB card.

    # Revalidate, do not refetch. The zips carry their build id in the file
    # name, so a long immutable max-age would in fact be correct for them -- but
    # they are downloaded once each and the page is the thing that changes, so
    # one rule that is right for the page costs nothing.
    add_header Cache-Control "no-cache" always;

    # In case the link is ever posted somewhere a crawler can follow it.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
